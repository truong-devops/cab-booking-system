global:
  namespace: cab-staging
  imageRegistry: harbor.your-domain.com/cab
  imageTag: CHANGE_ME_COMMIT_SHA
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - harbor-pull-secret
  secretName: cab-app-secrets
  nodeEnv: production
  commonEnv:
    OTEL_ENABLED: "false"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4318
    STARTUP_MAX_RETRIES: "0"
    STARTUP_RETRY_INITIAL_DELAY_MS: "1000"
    STARTUP_RETRY_MAX_DELAY_MS: "15000"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

namespace:
  create: true

serviceAccount:
  create: true
  name: cab-booking-system

ingress:
  enabled: true
  className: nginx
  host: api-staging.your-domain.com
  tlsSecretName: cab-api-staging-tls
  clusterIssuer: letsencrypt-staging
  serviceName: api-gateway
  servicePort: 3000

resources:
  default:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

probes:
  livenessPath: /health
  readinessPath: /readyz
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  dataNamespace: data-staging
  allowExternalEgress: true

resourceQuota:
  enabled: true
  requestsCpu: "4"
  requestsMemory: 8Gi
  limitsCpu: "8"
  limitsMemory: 16Gi

limitRange:
  enabled: true
  defaultCpu: 500m
  defaultMemory: 512Mi
  defaultRequestCpu: 100m
  defaultRequestMemory: 192Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

jobs:
  postgresDatabases:
    enabled: true
    image:
      repository: postgres-migrations
    env:
      POSTGRES_DB: cab_booking
      POSTGRES_HOST: postgres.data-staging.svc.cluster.local
    secretEnv:
      POSTGRES_USER: POSTGRES_USER
      PGPASSWORD: POSTGRES_PASSWORD
  postgresMigrations:
    enabled: true
    image:
      repository: postgres-migrations
    env:
      POSTGRES_HOST: postgres.data-staging.svc.cluster.local
      SERVICE_MIGRATIONS_ROOT: /docker-entrypoint-initdb.d/service-migrations
    secretEnv:
      POSTGRES_USER: POSTGRES_USER
      PGPASSWORD: POSTGRES_PASSWORD
  authAdminBootstrap:
    enabled: true
    image:
      repository: postgres-migrations
    env:
      POSTGRES_HOST: postgres.data-staging.svc.cluster.local
      BOOTSTRAP_ADMIN_BCRYPT_ROUNDS: "10"
    secretEnv:
      POSTGRES_USER: POSTGRES_USER
      PGPASSWORD: POSTGRES_PASSWORD
      BOOTSTRAP_ADMIN_EMAIL: BOOTSTRAP_ADMIN_EMAIL
      BOOTSTRAP_ADMIN_PASSWORD: BOOTSTRAP_ADMIN_PASSWORD
      BOOTSTRAP_ADMIN_USERNAME: BOOTSTRAP_ADMIN_USERNAME
  kafkaTopics:
    enabled: true
    image:
      repository: kafka-topics
    env:
      KAFKA_BOOTSTRAP_SERVER: kafka.data-staging.svc.cluster.local:9092
      KAFKA_TOPIC_RF: "1"
      KAFKA_TOPIC_MIN_ISR: "1"
      KAFKA_TOPIC_RETENTION_MS: "604800000"
      KAFKA_TOPIC_SEGMENT_MS: "3600000"
      KAFKA_DLQ_TOPIC_RETENTION_MS: "1209600000"

services:
  api-gateway:
    enabled: true
    replicas: 2
    image:
      repository: api-gateway
    port: 3000
    env:
      PROXY_TIMEOUT_MS: "30000"
      PROXY_RETRY_BACKOFF_MS: "100"
      GATEWAY_HTTPS_ENABLED: "false"
      AUTH_SERVICE_URL: http://auth-service:4001
      BOOKING_SERVICE_URL: http://booking-service:3003
      DRIVER_SERVICE_URL: http://driver-service:3011
      ETA_SERVICE_URL: http://eta-service:3012
      PLACES_SERVICE_URL: http://places-service:3014
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
      PAYMENT_SERVICE_URL: http://payment-service:3007
      PRICING_SERVICE_URL: http://pricing-service:3006
      AI_SERVICE_URL: http://ai-service:3013
      RIDE_SERVICE_URL: http://ride-service:3005
      REVIEW_SERVICE_URL: http://review-service:3009
      USER_SERVICE_URL: http://user-service:4004
    secretEnv:
      JWT_SECRET: JWT_SECRET
      INTERNAL_API_KEY: INTERNAL_API_KEY
  auth-service:
    enabled: true
    replicas: 2
    image:
      repository: auth-service
    port: 4001
    env:
      AUTH_PUBLIC_REGISTER_ROLES: user,driver
    secretEnv:
      DATABASE_URL: AUTH_DATABASE_URL
      JWT_SECRET: JWT_SECRET
  user-service:
    enabled: true
    replicas: 2
    image:
      repository: user-service
    port: 4004
    livenessPath: /healthz
    readinessPath: /healthz
    env:
      LOG_LEVEL: info
    secretEnv:
      DATABASE_URL: USER_DATABASE_URL
      INTERNAL_API_KEY: INTERNAL_API_KEY
  driver-service:
    enabled: true
    replicas: 2
    image:
      repository: driver-service
    port: 3011
    livenessPath: /healthz
    secretEnv:
      DATABASE_URL: DRIVER_DATABASE_URL
      REDIS_URL: REDIS_URL
      AUTH_JWT_SECRET: JWT_SECRET
  booking-service:
    enabled: true
    replicas: 2
    image:
      repository: booking-service
    port: 3003
    readinessPath: /health
    env:
      KAFKA_BROKERS: kafka.data-staging.svc.cluster.local:9092
      KAFKA_CONSUME_TOPICS: payment.completed,payment.failed
      ETA_BASE_URL: http://eta-service:3012
      PRICING_BASE_URL: http://pricing-service:3006
      AI_BASE_URL: http://ai-service:3013
      PAYMENT_BASE_URL: http://payment-service:3007
      BOOKING_LOAD_MINIMAL_RESPONSE: "false"
      BOOKING_LOAD_SKIP_PERSIST: "false"
      BOOKING_LOAD_SKIP_LIST_DB: "false"
      BOOKING_LOAD_SKIP_ACTIVE_CHECK: "false"
      BOOKING_LOAD_ULTRA_FAST_PATH: "false"
    secretEnv:
      DATABASE_URL: BOOKING_DATABASE_URL
      INTERNAL_API_KEY: INTERNAL_API_KEY
  ride-service:
    enabled: true
    replicas: 2
    image:
      repository: ride-service
    port: 3005
    env:
      KAFKA_BROKERS: kafka.data-staging.svc.cluster.local:9092
      KAFKA_CONSUMER_GROUP_ID: ride-service-group
    secretEnv:
      MONGODB_URI: RIDE_MONGODB_URI
      REDIS_URL: REDIS_URL
      JWT_SECRET: JWT_SECRET
  pricing-service:
    enabled: true
    replicas: 2
    image:
      repository: pricing-service
    port: 3006
    readinessPath: /ready
    env:
      COUPON_DISCOUNTS_JSON: '{"WELCOME10":10000,"VIP20":20000,"OFF50":50000}'
      RATES_JSON: '{"STANDARD":{"surgeMultiplier":1.1},"PREMIUM":{"surgeMultiplier":1.3}}'
    secretEnv:
      REDIS_URL: REDIS_URL
      JWT_SECRET: JWT_SECRET
      INTERNAL_API_KEY: INTERNAL_API_KEY
  payment-service:
    enabled: true
    replicas: 2
    image:
      repository: payment-service
    port: 3007
    env:
      KAFKA_BROKERS: kafka.data-staging.svc.cluster.local:9092
      KAFKA_CONSUME_TOPICS: ride.created,ride.assigned,ride.cancelled
      VIETQR_API_URL: https://api.vietqr.io/v2/generate
      VIETQR_FORMAT: text
      PAYOS_API_URL: https://api-merchant.payos.vn
      PAYOS_QR_SOURCE: PAYOS
      PAYOS_AUTO_SYNC_ENABLED: "false"
    secretEnv:
      DATABASE_URL: PAYMENT_DATABASE_URL
      REDIS_URL: REDIS_URL
      INTERNAL_API_KEY: INTERNAL_API_KEY
      JWT_ACCESS_SECRET: JWT_SECRET
      VIETQR_BANK_BIN: VIETQR_BANK_BIN
      VIETQR_ACCOUNT_NUMBER: VIETQR_ACCOUNT_NUMBER
      VIETQR_ACCOUNT_NAME: VIETQR_ACCOUNT_NAME
      VIETQR_CLIENT_ID: VIETQR_CLIENT_ID
      VIETQR_API_KEY: VIETQR_API_KEY
      PAYOS_CLIENT_ID: PAYOS_CLIENT_ID
      PAYOS_API_KEY: PAYOS_API_KEY
      PAYOS_CHECKSUM_KEY: PAYOS_CHECKSUM_KEY
      PAYOS_RETURN_URL: PAYOS_RETURN_URL
      PAYOS_CANCEL_URL: PAYOS_CANCEL_URL
  notification-service:
    enabled: true
    replicas: 2
    image:
      repository: notification-service
    port: 3010
    livenessPath: /healthz
    env:
      USER_SERVICE_BASE_URL: http://user-service:4004
    secretEnv:
      MONGODB_URI: NOTIFICATION_MONGODB_URI
      INTERNAL_API_KEY: INTERNAL_API_KEY
      AUTH_JWT_SECRET: JWT_SECRET
  review-service:
    enabled: true
    replicas: 2
    image:
      repository: review-service
    port: 3009
    secretEnv:
      DATABASE_URL: REVIEW_DATABASE_URL
      REDIS_URL: REDIS_URL
      JWT_SECRET: JWT_SECRET
  eta-service:
    enabled: true
    replicas: 2
    image:
      repository: eta-service
    port: 3012
  places-service:
    enabled: true
    replicas: 2
    image:
      repository: places-service
    port: 3014
    env:
      PLACES_PROVIDER_ENABLED: "true"
      PLACES_PROVIDER_BASE_URL: https://nominatim.openstreetmap.org
      PLACES_PROVIDER_TIMEOUT_MS: "1800"
      PLACES_PROVIDER_COUNTRY_CODES: vn
    secretEnv:
      DATABASE_URL: PLACES_DATABASE_URL
  ai-service:
    enabled: true
    replicas: 2
    image:
      repository: ai-service
    port: 3013
    secretEnv:
      INTERNAL_API_KEY: INTERNAL_API_KEY
