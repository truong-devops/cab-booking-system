{{- if .Values.jobs.postgresDatabases.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: cab-create-postgres-databases
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "cab.labels" . | nindent 4 }}
  annotations:
    {{- include "cab.hookAnnotations" (dict "weight" "-40") | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cab-create-postgres-databases
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "cab.serviceAccountName" . | quote }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . | quote }}
      {{- end }}
      {{- end }}
      containers:
        - name: create-databases
          image: {{ include "cab.image" (dict "root" . "image" .Values.jobs.postgresDatabases.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
          command:
            - /bin/sh
            - /docker-entrypoint-initdb.d/01-create-service-databases.sh
          env:
            {{- include "cab.envVars" (dict "plain" .Values.jobs.postgresDatabases.env "secret" .Values.jobs.postgresDatabases.secretEnv "secretName" .Values.global.secretName) | nindent 12 }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
{{- end }}
