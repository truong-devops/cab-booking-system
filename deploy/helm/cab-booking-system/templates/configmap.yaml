{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" $name | quote }}
  namespace: {{ $.Values.global.namespace | quote }}
  labels:
    {{- include "cab.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name | quote }}
data:
  SERVICE_NAME: {{ $name | quote }}
  PORT: {{ $svc.port | quote }}
  NODE_ENV: {{ $.Values.global.nodeEnv | quote }}
{{- range $key, $value := $.Values.global.commonEnv }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- range $key, $value := $svc.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{- end }}
{{- end }}
