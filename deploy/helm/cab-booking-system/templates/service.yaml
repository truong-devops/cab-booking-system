{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Values.global.namespace | quote }}
  labels:
    {{- include "cab.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "cab.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
---
{{- end }}
{{- end }}
