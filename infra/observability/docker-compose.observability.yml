x-app-syslog-logging: &app_syslog_logging
  driver: syslog
  options:
    syslog-address: 'tcp://${LOGSTASH_SYSLOG_HOST:-host.docker.internal}:${LOGSTASH_SYSLOG_PORT:-42195}'
    syslog-format: rfc5424micro
    tag: '{{.Name}}'

services:
  # Overlay logging config for application services in infra/docker-compose.dev.yml.
  # This keeps base compose unchanged; logs are routed to Logstash only when this
  # observability compose file is included.
  api-gateway:
    logging: *app_syslog_logging

  auth-service:
    logging: *app_syslog_logging

  user-service:
    logging: *app_syslog_logging

  ride-service:
    logging: *app_syslog_logging

  booking-service:
    logging: *app_syslog_logging

  driver-service:
    logging: *app_syslog_logging

  notification-service:
    logging: *app_syslog_logging

  pricing-service:
    logging: *app_syslog_logging

  payment-service:
    logging: *app_syslog_logging

  review-service:
    logging: *app_syslog_logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    command: ['--config=/etc/otel-collector.yml']
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-dev}
    volumes:
      - ./observability/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - '${OTEL_GRPC_HOST_PORT:-42197}:4317' # OTLP gRPC
      - '${OTEL_HTTP_HOST_PORT:-42198}:4318' # OTLP HTTP
      - '${OTEL_METRICS_HOST_PORT:-42199}:8889' # Prometheus scrape (metrics)
    depends_on:
      - tempo
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.51.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_HOST_PORT:-42191}:9090'
    depends_on:
      - alertmanager
    networks:
      - backend

  alertmanager:
    image: prom/alertmanager:v0.28.0
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        sed \
          -e "s|__ALERT_DEFAULT_RECEIVER__|${ALERT_DEFAULT_RECEIVER:-generic-webhook}|g" \
          -e "s|__ALERT_WARNING_RECEIVER__|${ALERT_WARNING_RECEIVER:-generic-webhook}|g" \
          -e "s|__ALERT_CRITICAL_RECEIVER__|${ALERT_CRITICAL_RECEIVER:-generic-webhook}|g" \
          -e "s|__ALERT_WEBHOOK_URL__|${ALERT_WEBHOOK_URL:-http://host.docker.internal:19093/alerts}|g" \
          -e "s|__SLACK_WEBHOOK_URL__|${SLACK_WEBHOOK_URL:-http://127.0.0.1:65535/slack}|g" \
          -e "s|__SLACK_CHANNEL__|${SLACK_CHANNEL:-#cab-alerts}|g" \
          -e "s|__TELEGRAM_BOT_TOKEN__|${TELEGRAM_BOT_TOKEN:-disabled}|g" \
          -e "s|__TELEGRAM_CHAT_ID__|${TELEGRAM_CHAT_ID:-1}|g" \
          /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.rendered.yml
        exec alertmanager --config.file=/tmp/alertmanager.rendered.yml
    environment:
      ALERT_DEFAULT_RECEIVER: ${ALERT_DEFAULT_RECEIVER:-generic-webhook}
      ALERT_WARNING_RECEIVER: ${ALERT_WARNING_RECEIVER:-generic-webhook}
      ALERT_CRITICAL_RECEIVER: ${ALERT_CRITICAL_RECEIVER:-generic-webhook}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://host.docker.internal:19093/alerts}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-http://127.0.0.1:65535/slack}
      SLACK_CHANNEL: '${SLACK_CHANNEL:-#cab-alerts}'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-disabled}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-1}
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - '${ALERTMANAGER_HOST_PORT:-42192}:9093'
    networks:
      - backend

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '${GRAFANA_HOST_PORT:-42190}:3000'
    depends_on:
      - prometheus
      - tempo
    networks:
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.enrollment.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes:
      - ./observability/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - '${ELASTICSEARCH_HOST_PORT:-42194}:9200'
    networks:
      - backend

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    environment:
      LS_JAVA_OPTS: '-Xms256m -Xmx256m'
      LOGSTASH_SYSLOG_PORT: 5514
      DEPLOY_ENV: ${DEPLOY_ENV:-dev}
    volumes:
      - ./observability/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - '${LOGSTASH_SYSLOG_PORT:-42195}:5514'
      - '${LOGSTASH_API_HOST_PORT:-42196}:9600'
    depends_on:
      - elasticsearch
    networks:
      - backend

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - ./observability/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - '${KIBANA_HOST_PORT:-42193}:5601'
    depends_on:
      - elasticsearch
    networks:
      - backend

  tempo:
    image: grafana/tempo:2.4.1
    command: ['-config.file=/etc/tempo/tempo.yml']
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - '${TEMPO_HOST_PORT:-42188}:3200'
      - '${TEMPO_GRPC_HOST_PORT:-42187}:4317'
    networks:
      - backend

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
  elasticsearch_data:

networks:
  backend:
    driver: bridge
