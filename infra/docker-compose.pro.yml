x-service-defaults: &service-defaults
  restart: unless-stopped

x-job-defaults: &job-defaults
  restart: "no"

x-otel-env: &otel-env
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

x-startup-env: &startup-env
  STARTUP_MAX_RETRIES: ${STARTUP_MAX_RETRIES:-0}
  STARTUP_RETRY_INITIAL_DELAY_MS: ${STARTUP_RETRY_INITIAL_DELAY_MS:-1000}
  STARTUP_RETRY_MAX_DELAY_MS: ${STARTUP_RETRY_MAX_DELAY_MS:-15000}

x-kafka-client-env: &kafka-client-env
  KAFKA_SSL: ${KAFKA_SSL:-false}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}

services:
  zookeeper:
    <<: *service-defaults
    image: zookeeper:3.9-jre-17
    environment:
      ZOO_TICK_TIME: 2000
    networks:
      - backend

  kafka:
    <<: *service-defaults
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_SINGLE_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_INTERNAL_TOPIC_RF:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_INTERNAL_TOPIC_MIN_ISR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_INTERNAL_TOPIC_RF:-1}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_TOPIC_RF:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_TOPIC_MIN_ISR:-1}
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_DEFAULT_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-false}
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - backend

  kafka-topics-bootstrap:
    <<: *job-defaults
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER:-kafka:9092}
      KAFKA_BOOTSTRAP_WAIT_ATTEMPTS: ${KAFKA_BOOTSTRAP_WAIT_ATTEMPTS:-30}
      KAFKA_BOOTSTRAP_WAIT_MS: ${KAFKA_BOOTSTRAP_WAIT_MS:-2000}
      KAFKA_TOPIC_RF: ${KAFKA_TOPIC_RF:-1}
      KAFKA_TOPIC_MIN_ISR: ${KAFKA_TOPIC_MIN_ISR:-1}
      KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-604800000}
      KAFKA_TOPIC_SEGMENT_MS: ${KAFKA_TOPIC_SEGMENT_MS:-3600000}
      KAFKA_DLQ_TOPIC_RETENTION_MS: ${KAFKA_DLQ_TOPIC_RETENTION_MS:-1209600000}
      KAFKA_TOPIC_SPECS: ${KAFKA_TOPIC_SPECS:-ride.created:6 ride.assigned:6 ride.cancelled:6 payment.completed:6 payment.failed:6 review.created:3 driver.location.updated:12}
      KAFKA_RETRY_TIERS: ${KAFKA_RETRY_TIERS:-retry.30s:1800000 retry.5m:21600000 retry.30m:259200000}
    volumes:
      - ./kafka/bootstrap-topics.sh:/opt/kafka-bootstrap/bootstrap-topics.sh:ro
    command: ['/bin/sh', '/opt/kafka-bootstrap/bootstrap-topics.sh']
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - cab_redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api-gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - '${API_GATEWAY_HOST_PORT:-42100}:3000'
      - '${API_GATEWAY_HTTPS_HOST_PORT:-42101}:3443'
    environment:
      <<: *otel-env
      SERVICE_NAME: api-gateway
      NODE_ENV: production
      OTEL_SERVICE_NAME: api-gateway
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SERVICE_URL: http://auth-service:4001
      BOOKING_SERVICE_URL: http://booking-service:3003
      DRIVER_SERVICE_URL: http://driver-service:3011
      ETA_SERVICE_URL: http://eta-service:3012
      PLACES_SERVICE_URL: http://places-service:3014
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
      PAYMENT_SERVICE_URL: http://payment-service:3007
      PRICING_SERVICE_URL: http://pricing-service:3006
      AI_SERVICE_URL: http://ai-service:3013
      RIDE_SERVICE_URL: http://ride-service:3005
      REVIEW_SERVICE_URL: http://review-service:3009
      USER_SERVICE_URL: http://user-service:4004
      PROXY_TIMEOUT_MS: 30000
      PROXY_RETRY_BACKOFF_MS: 100
      GATEWAY_HTTPS_ENABLED: ${GATEWAY_HTTPS_ENABLED:-false}
      HTTPS_PORT: ${HTTPS_PORT:-3443}
      HTTPS_CERT_PATH: ${HTTPS_CERT_PATH:-/app/src/certs/dev-gateway.crt}
      HTTPS_KEY_PATH: ${HTTPS_KEY_PATH:-/app/src/certs/dev-gateway.key}
    depends_on:
      auth-service:
        condition: service_started
      booking-service:
        condition: service_started
      driver-service:
        condition: service_started
      eta-service:
        condition: service_started
      places-service:
        condition: service_started
      notification-service:
        condition: service_started
      payment-service:
        condition: service_started
      pricing-service:
        condition: service_started
      ai-service:
        condition: service_started
      ride-service:
        condition: service_started
      review-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - backend

  auth-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env]
      SERVICE_NAME: auth-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: auth-service
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/auth-service_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_PUBLIC_REGISTER_ROLES: ${AUTH_PUBLIC_REGISTER_ROLES:-user,driver}
    depends_on:
      auth-admin-bootstrap:
        condition: service_completed_successfully
    networks:
      - backend

  user-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env]
      SERVICE_NAME: user-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: user-service
      PORT: 4004
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/user-service_db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    networks:
      - backend

  ride-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/ride-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env, *kafka-client-env]
      SERVICE_NAME: ride-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: ride-service
      PORT: 3005
      MONGODB_URI: ${RIDE_MONGODB_URI:?RIDE_MONGODB_URI is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CONSUMER_GROUP_ID: ride-service-group
      KAFKA_CONSUMER_PARTITIONS_CONCURRENCY: 1
      KAFKA_CONSUMER_MAX_MESSAGES_PER_BATCH: 100
      KAFKA_CONSUMER_AUTO_COMMIT_INTERVAL_MS: 1000
      KAFKA_CONSUMER_AUTO_COMMIT_THRESHOLD: 1
      KAFKA_CONSUMER_SESSION_TIMEOUT_MS: 30000
      KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS: 3000
      KAFKA_CONSUMER_REBALANCE_TIMEOUT_MS: 60000
      KAFKA_CONSUMER_MAX_BYTES_PER_PARTITION: 1048576
      KAFKA_CONSUMER_MIN_BYTES: 1
      KAFKA_CONSUMER_MAX_BYTES: 10485760
      KAFKA_CONSUMER_MAX_WAIT_MS: 5000
      KAFKA_CONSUMER_RETRY_RETRIES: 8
      KAFKA_CONSUMER_RETRY_INITIAL_MS: 300
      KAFKA_CONSUMER_RETRY_MAX_MS: 30000
      KAFKA_PRODUCER_ACKS: -1
      KAFKA_PRODUCER_REQUEST_TIMEOUT_MS: 30000
      KAFKA_PRODUCER_MAX_IN_FLIGHT_REQUESTS: 5
      KAFKA_PRODUCER_RETRY_RETRIES: 8
      KAFKA_PRODUCER_RETRY_INITIAL_MS: 300
      KAFKA_PRODUCER_RETRY_MAX_MS: 30000
      OUTBOX_PUBLISH_INTERVAL_MS: 5000
      OUTBOX_PUBLISH_BATCH_SIZE: 50
      OUTBOX_MAX_ATTEMPTS: 10
      OUTBOX_RETRY_BASE_MS: 1000
      OUTBOX_RETRY_MAX_MS: 60000
      OUTBOX_PROCESSING_TIMEOUT_MS: 300000
      INBOX_MAX_ATTEMPTS: 10
      INBOX_RETRY_BASE_MS: 1000
      INBOX_RETRY_MAX_MS: 60000
      INBOX_PROCESSING_TIMEOUT_MS: 300000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-topics-bootstrap:
        condition: service_completed_successfully
    networks:
      - backend

  booking-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/booking-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env, *kafka-client-env]
      SERVICE_NAME: booking-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: booking-service
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/booking-service_db
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CONSUME_TOPICS: payment.completed,payment.failed
      KAFKA_CONSUMER_GROUP_ID: booking-service-group
      KAFKA_CONSUMER_PARTITIONS_CONCURRENCY: 1
      KAFKA_CONSUMER_MAX_MESSAGES_PER_BATCH: 100
      KAFKA_CONSUMER_AUTO_COMMIT_INTERVAL_MS: 1000
      KAFKA_CONSUMER_AUTO_COMMIT_THRESHOLD: 1
      KAFKA_CONSUMER_RETRY_RETRIES: 8
      KAFKA_CONSUMER_RETRY_INITIAL_MS: 300
      KAFKA_CONSUMER_RETRY_MAX_MS: 30000
      KAFKA_PRODUCER_ACKS: -1
      KAFKA_PRODUCER_REQUEST_TIMEOUT_MS: 30000
      KAFKA_PRODUCER_MAX_IN_FLIGHT_REQUESTS: 5
      KAFKA_PRODUCER_RETRY_RETRIES: 8
      KAFKA_PRODUCER_RETRY_INITIAL_MS: 300
      KAFKA_PRODUCER_RETRY_MAX_MS: 30000
      OUTBOX_PUBLISH_INTERVAL_MS: 3000
      OUTBOX_PUBLISH_BATCH_SIZE: 50
      OUTBOX_MAX_ATTEMPTS: 10
      OUTBOX_RETRY_BASE_MS: 1000
      OUTBOX_RETRY_MAX_MS: 60000
      OUTBOX_PROCESSING_TIMEOUT_MS: 300000
      ETA_BASE_URL: http://eta-service:3012
      PRICING_BASE_URL: http://pricing-service:3006
      AI_BASE_URL: http://ai-service:3013
      PAYMENT_BASE_URL: http://payment-service:3007
      PAYMENT_FALLBACK_BASE_URLS: ''
      PAYMENT_IP_FAMILY: 4
      PAYMENT_REQUEST_TIMEOUT_MS: 5000
      PAYMENT_HTTP_RETRY_MAX: 2
      PAYMENT_HTTP_RETRY_BACKOFF_MS: 150
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      BOOKING_LOAD_MINIMAL_RESPONSE: 'false'
      BOOKING_LOAD_SKIP_PERSIST: 'false'
      BOOKING_LOAD_SKIP_LIST_DB: 'false'
      BOOKING_LOAD_SKIP_ACTIVE_CHECK: 'false'
      BOOKING_LOAD_ULTRA_FAST_PATH: 'false'
    depends_on:
      kafka-topics-bootstrap:
        condition: service_completed_successfully
      postgres-migrations:
        condition: service_completed_successfully
      eta-service:
        condition: service_started
      ai-service:
        condition: service_started
    networks:
      - backend

  eta-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/eta-service/Dockerfile
    environment:
      <<: *otel-env
      SERVICE_NAME: eta-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: eta-service
      PORT: 3012
    networks:
      - backend

  places-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/places-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env]
      SERVICE_NAME: places-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: places-service
      PORT: 3014
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/places-service_db
      PLACES_PROVIDER_ENABLED: ${PLACES_PROVIDER_ENABLED:-true}
      PLACES_PROVIDER_BASE_URL: ${PLACES_PROVIDER_BASE_URL:-https://nominatim.openstreetmap.org}
      PLACES_PROVIDER_TIMEOUT_MS: ${PLACES_PROVIDER_TIMEOUT_MS:-1800}
      PLACES_PROVIDER_COUNTRY_CODES: ${PLACES_PROVIDER_COUNTRY_CODES:-vn}
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    networks:
      - backend

  ai-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/ai-service/Dockerfile
    environment:
      <<: *otel-env
      SERVICE_NAME: ai-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: ai-service
      PORT: 3013
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    networks:
      - backend

  driver-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/driver-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env]
      SERVICE_NAME: driver-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: driver-service
      PORT: 3011
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/driver-service_db
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AUTH_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  notification-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env]
      SERVICE_NAME: notification-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: notification-service
      PORT: 3010
      MONGODB_URI: ${NOTIFICATION_MONGODB_URI:?NOTIFICATION_MONGODB_URI is required}
      USER_SERVICE_BASE_URL: http://user-service:4004
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      AUTH_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      mongo:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - backend

  pricing-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/pricing-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env]
      SERVICE_NAME: pricing-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: pricing-service
      PORT: 3006
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      COUPON_DISCOUNTS_JSON: '{"WELCOME10":10000,"VIP20":20000,"OFF50":50000}'
      RATES_JSON: '{"STANDARD":{"surgeMultiplier":1.1},"PREMIUM":{"surgeMultiplier":1.3}}'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  payment-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env, *kafka-client-env]
      SERVICE_NAME: payment-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: payment-service
      PORT: 3007
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/payment-service_db
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CONSUME_TOPICS: ride.created,ride.assigned,ride.cancelled
      KAFKA_CONSUMER_GROUP_ID: payment-service-group
      KAFKA_CONSUMER_PARTITIONS_CONCURRENCY: 1
      KAFKA_CONSUMER_MAX_MESSAGES_PER_BATCH: 100
      KAFKA_CONSUMER_AUTO_COMMIT_INTERVAL_MS: 1000
      KAFKA_CONSUMER_AUTO_COMMIT_THRESHOLD: 1
      KAFKA_CONSUMER_SESSION_TIMEOUT_MS: 30000
      KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS: 3000
      KAFKA_CONSUMER_REBALANCE_TIMEOUT_MS: 60000
      KAFKA_CONSUMER_MAX_BYTES_PER_PARTITION: 1048576
      KAFKA_CONSUMER_MIN_BYTES: 1
      KAFKA_CONSUMER_MAX_BYTES: 10485760
      KAFKA_CONSUMER_MAX_WAIT_MS: 5000
      KAFKA_CONSUMER_RETRY_RETRIES: 8
      KAFKA_CONSUMER_RETRY_INITIAL_MS: 300
      KAFKA_CONSUMER_RETRY_MAX_MS: 30000
      KAFKA_PRODUCER_ACKS: -1
      KAFKA_PRODUCER_REQUEST_TIMEOUT_MS: 30000
      KAFKA_PRODUCER_MAX_IN_FLIGHT_REQUESTS: 5
      KAFKA_PRODUCER_RETRY_RETRIES: 8
      KAFKA_PRODUCER_RETRY_INITIAL_MS: 300
      KAFKA_PRODUCER_RETRY_MAX_MS: 30000
      OUTBOX_PUBLISH_INTERVAL_MS: 5000
      OUTBOX_PUBLISH_BATCH_SIZE: 50
      OUTBOX_MAX_ATTEMPTS: 10
      OUTBOX_RETRY_BASE_MS: 1000
      OUTBOX_RETRY_MAX_MS: 60000
      OUTBOX_PROCESSING_TIMEOUT_MS: 300000
      JWT_ACCESS_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      VIETQR_API_URL: ${VIETQR_API_URL:-https://api.vietqr.io/v2/generate}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:?VIETQR_BANK_BIN is required}
      VIETQR_ACCOUNT_NUMBER: ${VIETQR_ACCOUNT_NUMBER:?VIETQR_ACCOUNT_NUMBER is required}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:?VIETQR_ACCOUNT_NAME is required}
      VIETQR_MERCHANT_CITY: '${VIETQR_MERCHANT_CITY:-HO CHI MINH}'
      VIETQR_FORMAT: ${VIETQR_FORMAT:-text}
      VIETQR_CLIENT_ID: ${VIETQR_CLIENT_ID:-}
      VIETQR_API_KEY: ${VIETQR_API_KEY:-}
      VIETQR_EXPIRES_IN_MINUTES: ${VIETQR_EXPIRES_IN_MINUTES:-15}
      PAYOS_API_URL: ${PAYOS_API_URL:-https://api-merchant.payos.vn}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:?PAYOS_CLIENT_ID is required}
      PAYOS_API_KEY: ${PAYOS_API_KEY:?PAYOS_API_KEY is required}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:?PAYOS_CHECKSUM_KEY is required}
      PAYOS_PARTNER_CODE: ${PAYOS_PARTNER_CODE:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:?PAYOS_RETURN_URL is required}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:?PAYOS_CANCEL_URL is required}
      PAYOS_QR_SOURCE: ${PAYOS_QR_SOURCE:-PAYOS}
      PAYOS_AUTO_SYNC_ENABLED: ${PAYOS_AUTO_SYNC_ENABLED:-false}
      PAYOS_AUTO_SYNC_INTERVAL_MS: ${PAYOS_AUTO_SYNC_INTERVAL_MS:-15000}
      PAYOS_AUTO_SYNC_BATCH_SIZE: ${PAYOS_AUTO_SYNC_BATCH_SIZE:-20}
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-topics-bootstrap:
        condition: service_completed_successfully
    networks:
      - backend

  review-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/review-service/Dockerfile
    environment:
      <<: [*otel-env, *startup-env]
      SERVICE_NAME: review-service
      NODE_ENV: production
      OTEL_SERVICE_NAME: review-service
      PORT: 3009
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/review-service_db
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  # =========================
  # Infra: Postgres (demo future)
  # =========================
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cab_booking}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_BCRYPT_ROUNDS: ${BOOTSTRAP_ADMIN_BCRYPT_ROUNDS:-10}
    volumes:
      - cab_postgres_data:/var/lib/postgresql/data
      - ./postgres/pro-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  postgres-databases:
    <<: *job-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cab_booking}
      POSTGRES_HOST: postgres
    volumes:
      - ./postgres/pro-init:/docker-entrypoint-initdb.d:ro
    command: ['/bin/sh', '/docker-entrypoint-initdb.d/01-create-service-databases.sh']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres-migrations:
    <<: *job-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      SERVICE_MIGRATIONS_ROOT: /docker-entrypoint-initdb.d/service-migrations
    volumes:
      - ./postgres/pro-init:/docker-entrypoint-initdb.d:ro
    command: ['/bin/sh', '/docker-entrypoint-initdb.d/02-apply-service-schemas.sh']
    depends_on:
      postgres-databases:
        condition: service_completed_successfully
    networks:
      - backend

  auth-admin-bootstrap:
    <<: *job-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_BCRYPT_ROUNDS: ${BOOTSTRAP_ADMIN_BCRYPT_ROUNDS:-10}
    volumes:
      - ./postgres/pro-init:/docker-entrypoint-initdb.d:ro
    command: ['/bin/sh', '/docker-entrypoint-initdb.d/03-bootstrap-auth-admin.sh']
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    networks:
      - backend

  pgadmin:
    <<: *service-defaults
    image: dpage/pgadmin4:8
    profiles: ['ops']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - '${PGADMIN_HOST_PORT:-42137}:80'
    volumes:
      - cab_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  mongo:
    <<: *service-defaults
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - cab_mongo_data:/data/db
      - ./mongo/pro-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1'
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  cab_postgres_data:
  cab_pgadmin_data:
  cab_redis_data:
  cab_mongo_data:

networks:
  backend:
    driver: bridge
